[package]
name = "ambery"
version = "0.1.0-alpha0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 透明窗口（tauri.conf 全窗口 transparent:true）必需
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
ambery-core = { path = "../../core" }
ambery-terminal-wt = { path = "../../packages/terminals/wt" }
ambery-terminal-zellij = { path = "../../packages/terminals/zellij" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
axum = { version = "0.8", features = ["ws"] }

# Windows 专属（docs/tauri-shell.md §跨平台与 UIA 边界）：虚拟桌面 pin / Win32 窗口动作
[target.'cfg(windows)'.dependencies]
winvd = "0.0.49"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
