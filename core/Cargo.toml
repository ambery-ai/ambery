[package]
name = "ambery-core"
version = "0.1.0-alpha0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
sys-locale = "0.3.2"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[lib]
path = "src/lib.rs"

[dependencies.ambery-observe-derive]
path = "../observe-derive"
optional = true

[features]
default = []
# case-runner（docs/case-runner.md）：storage 快照回放、概念观测与 headless 前端 debug 注入面
case-runner = ["dep:ambery-observe-derive"]
# debug-agent：DebugAgent mock 后端。dev 构建经 debug_assertions 自动包含；
# 正式出包（release）默认不含任何 debug 代码，ambery-case 等开发工具显式开启
debug-agent = []
