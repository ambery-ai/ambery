[package]
name = "overseer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"

[lib]
path = "src/lib.rs"

[[bin]]
name = "overseer-debug"
path = "src/bin/overseer-debug.rs"

[dependencies.overseer-observe-derive]
path = "../observe-derive"
optional = true

[features]
default = ["mock"]
# mock 面（core/src/mock.rs）：真实 hook 接入后删此 feature 及模块
mock = []
# case-runner（docs/case-runner.md）：storage 快照回放与概念观测
case-runner = ["dep:overseer-observe-derive"]
